# Ansible Dynamic Inventory

```yaml
plugin: amazon.aws.aws_ec2

regions:
  - ap-south-1
  - us-east-1
  - eu-west-1

filters:
  instance-state-name: running

hostnames:
  - private-ip-address

keyed_groups:
  - key: tags.Environment
    prefix: env

compose:
  ansible_host: private_ip_address
